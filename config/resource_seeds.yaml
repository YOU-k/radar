# 资源登记的人工种子：规范名、别名、规模、获取、开放性、置顶优先级。
#
# 为什么要种子：自动登记（background/resources.py）从证据里用 LLM 抽资源，规模取自某一篇引用文献
# （UKB 被写成"30,376 人"是某篇论文的子集）、开放性是 LLM 猜的、链接常指错。种子里的字段**覆盖**
# 自动抽取的同名字段，并且种子条目即使没有证据引用也进主表。
# 合并了原先手工维护的 registry/databases.md 与 registry/models.md（那两份的条目都在这里了）。
#
# 字段：
#   name      规范名（显示用）
#   aliases   别名（归一化后映射到本条；只放无歧义的）
#   match     链接核验时页面里应出现的字符串（缺省用 name + aliases）
#   kind      dataset / model / benchmark / database / tool
#   modality / scale / access   覆盖自动抽取；access 写 "" 表示清掉自动抽到的错链接
#   open      yes 公开下载 / partial 部分公开（汇总公开、个体数据受控）/ registration 注册即可 /
#             controlled 受控申请 / commercial 商业平台 / no 不公开 / unknown 未确认
#   themes    主题 key（config/themes.yaml），与证据推出的主题取并集
#   pin       P0 / P1：研究者画像点名的资源，无论被引几次都置顶，不交给 LLM 重排
#   why       置顶理由（≤40 字）
#
# 另外三张表：aliases（额外别名 → 规范名）、split（同名异物按 kind 拆开）、exclude（不是资源的条目）。

resources:
  # ---- 人群队列（中国队列一律优先；ChinaHEART 是目标队列）----
  - name: ChinaHEART
    aliases: [China HEART, ChinaHEART cohort, ChinaHEART Project]
    kind: dataset
    modality: 心血管病筛查人群队列（问卷/体检/心电等）
    scale: 中国大规模心血管病筛查/早筛队列
    open: controlled
    themes: [cardio, cohort]
    pin: P0
    why: 目标队列：UKB 等公共队列方法迁移的落点
  - name: China Kadoorie Biobank
    aliases: [CKB, China Kadoorie Biobank (CKB), 中国嘉道理生物库]
    match: [Kadoorie]
    kind: dataset
    modality: 前瞻性人群队列（问卷/体检/血样/基因组/蛋白组）
    scale: 约 51 万成人（10 个地区，2004–08 入组）
    access: https://www.ckbiobank.org/
    open: controlled
    themes: [cohort, cardio]
    pin: P0
    why: 中国人群参照队列，ChinaHEART 迁移时的对照
  - name: UK Biobank
    aliases: [UKB, UKBB, UK Biobank (UKB), UK Biobank (UKBB)]
    kind: dataset
    modality: 人群队列（基因组/影像/蛋白组/代谢组/EHR）
    scale: 约 50 万人（40–69 岁入组，2006–10）
    access: https://www.ukbiobank.ac.uk/
    open: controlled
    themes: [cohort]
  - name: UK Biobank Pharma Proteomics Project
    aliases: [UKB-PPP, UKB PPP, UK Biobank Pharma Proteomics Project (UKB-PPP), UKB Pharma Proteomics Project]
    match: [Pharma Proteomics, UKB-PPP]
    kind: dataset
    modality: 血浆蛋白组（Olink Explore）
    scale: 约 5.4 万人 · 约 2,900 蛋白
    access: https://www.ukbiobank.ac.uk/
    open: controlled
    themes: [cohort, aging]
  - name: All of Us Research Program
    aliases: [All of Us, AoU, All of Us Research Program (AoU)]
    match: [All of Us]
    kind: dataset
    modality: 人群队列（WGS/EHR/问卷/可穿戴）
    scale: 目标 100 万人（美国，多族裔）
    access: https://www.researchallofus.org/
    open: controlled
    themes: [cohort]
  - name: CHARLS
