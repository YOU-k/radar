aliases:  # 额外别名 → 规范名（归一化前的原样写法即可）
  Olink Proteomics Panel (UK Biobank): UK Biobank Pharma Proteomics Project

split:  # 同名异物：按 kind 拆成不同条目
  DISCO:
    database: DISCO (single-cell database)
    dataset: DISCO (single-cell database)
    model: DISCO (ECG HFrEF study)
    tool: DISCO (ECG HFrEF study)

exclude:  # 不是可复用资源（算法名、泛称），挖到也丢掉
  - GRPO
  - PPO
  - DPO
  - single-cell data
