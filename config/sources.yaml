# 信息源定义。按 7 个领域分组。
# 新增来源：在对应 domain 下加关键词 / query / feed 即可，collector 会自动拾取。
# 节奏：每个源可标 cadence: daily(默认) / weekly(周日收) / monthly(每月1号收)。
#   论文类保持 daily；格局型源（github/hf/blog）建议 weekly 或 monthly 降噪。
#   支持的位置：arxiv.cadence、europepmc_cadence、github_cadence、hf_cadence、
#   rss 条目写成 {url, cadence}、顶层 s2_cadence。

domains:
  - name: aging_multimodal
    label_zh: 衰老与多模态健康模型
    keywords_zh: [衰老时钟, 表观遗传时钟, 蛋白质组年龄, 多模态衰老, 类器官衰老, 生物年龄, 衰老生物标志物, 转录组年龄, 甲基化年龄, 扰动响应, 长寿, 衰老基准]
    keywords_en: [aging clock, epigenetic clock, proteomic age, multimodal aging, organoid aging, biological age, biological age prediction, aging biomarker, DNA methylation age, transcriptomic age, perturbation response, cell painting aging, omics age, longevity, aging biology, aging research, geroscience, senescence, lifespan, healthspan, benchmark]
    arxiv:
      categories: [q-bio.QM, q-bio.GN, q-bio.CB]
      queries:
        - "aging clock"
        - "epigenetic clock"
        - "proteomic age"
        - "multimodal aging"
        - "organoid aging"
        - "biological age prediction"
        - "DNA methylation age"
        - "cell painting aging"
        - "aging biology language model"
        - "longevity benchmark"
    europepmc_query: '(aging clock OR biological age OR epigenetic age OR methylation age OR "transcriptomic age" OR "proteomic age" OR "aging biomarker" OR longevity OR "aging research" OR geroscience) AND (multimodal OR proteomic OR methylation OR organoid OR single-cell OR "spatial transcriptomics" OR "language model" OR "foundation model" OR benchmark OR "deep learning")'
    # 整刊订阅：新文全收（不限关键词），相关性交给 LLM 从严打分。
    # CNS 正刊全学科、量大，先经关键词粗筛（含 aging 等词才进 top40），
    # 所以只放aging 领域，不污染其他领域配额。
    journals:
      - Nature
      - Science
      - Cell
      - Nature Aging
      - Aging Cell
      - GeroScience
      - Nature Cell Biology
      - Cell Metabolism
      - Nature Metabolism
      - Cell Stem Cell
    rss: []  # 期刊源已由上方 EuropePMC 整刊订阅覆盖（nataging/wiley feed 不稳定）
    github_queries:
      - aging-clock
      - epigenetic-clock
      - biological age prediction
      - methylation clock
    github_cadence: weekly
    hf_queries:
      - aging
      - methylation
      - biological age
    hf_cadence: weekly

  - name: data_models
    label_zh: 生物医学数据库 / 模型 / 部署
    keywords_zh: [单细胞, 空间转录组, 蛋白质组, 甲基化, 细胞绘制, foundation model, 扰动测序, 虚拟细胞, 蛋白语言模型]
    keywords_en: [single-cell, spatial transcriptomics, proteomics, methylation, cell painting, foundation model, single-cell atlas, protein language model, perturb-seq, CRISPR screen, virtual cell, multimodal integration]
    arxiv:
      categories: [q-bio.QM, cs.CV, cs.LG]
      queries:
        - "single-cell foundation model"
        - "spatial transcriptomics"
        - "cell painting"
        - "protein language model"
        - "perturb-seq"
        - "virtual cell"
    europepmc_query: '(single-cell OR "spatial transcriptomics" OR proteomics OR "protein language model") AND (database OR benchmark OR "foundation model" OR atlas)'
    journals:
      - Nature Methods
      - Nature Biotechnology
    rss: []  # 原 nbt.rss 已由整刊订阅覆盖
    github_queries:
      - single-cell
      - spatial-transcriptomics
      - foundation-model
      - cell-painting
      - perturb-seq
      - protein-language-model
    github_cadence: weekly
    hf_queries:
      - single-cell
      - spatial transcriptomics
      - proteomics
      - methylation
      - cell painting
      - protein language model
    hf_cadence: weekly

  - name: population_omics_ai
    label_zh: 人群健康与多组学 AI
    # 2026-09 新增：Delphi（Nature 2025，生成式 Transformer 学 UKB+丹麦 EHR 预测 1000+ 疾病轨迹）、
    # ALADYNOULLI（Nature 2026，贝叶斯生成模型 EHR+胚系遗传，348 病 21 个可复现特征谱）这一类：
    # 大规模队列 / 生物样本库 / EHR 的生成式建模、疾病轨迹预测、人群多组学（血浆蛋白组、代谢组、甲基化）+ 遗传整合。
    keywords_zh: [生物样本库, 电子健康记录, 疾病轨迹, 疾病风险预测, 多基因风险, 人群队列, 血浆蛋白组, 代谢组, 全基因组关联, 纵向队列, 健康轨迹, 医学基础模型]
    keywords_en: [UK Biobank, biobank, electronic health record, EHR, disease trajectory, disease risk prediction, polygenic, population cohort, plasma proteome, proteomic profiling, metabolomics, GWAS, longitudinal, health trajectory, medical foundation model, generative model, All of Us, FinnGen, multi-omics cohort, phenome-wide, comorbidity]
    arxiv:
      categories: [cs.LG, stat.ML, q-bio.QM, stat.AP]
      queries:
        - "electronic health records foundation model"
        - "disease trajectory"
        - "UK Biobank"
        - "biobank deep learning"
        - "multi-omics cohort"
        - "polygenic risk deep learning"
        - "generative model patient trajectories"
    europepmc_query: '("UK Biobank" OR biobank OR "electronic health records" OR "disease trajectory" OR "disease trajectories" OR polygenic OR "population-scale" OR "All of Us" OR FinnGen) AND ("deep learning" OR "generative model" OR transformer OR "foundation model" OR "machine learning" OR "multi-omics" OR multiomics OR "plasma proteome" OR proteomic OR metabolomic OR "language model")'
    # 整刊订阅（CREATION_DATE 实测周量：Nat Med ~19、Nat Genet ~7、Cell Genom ~3、Nat Mach Intell ~1）。
    # Nature Communications 周量 240，噪声太大，不整刊订阅，靠上方关键词 query 覆盖。
    journals:
      - Nature Medicine
      - Nature Genetics
      - Cell Genomics
      - Nature Machine Intelligence
    rss: []
    github_queries:
      - uk-biobank
      - electronic-health-records
      - disease-trajectory
      - polygenic-risk
    github_cadence: weekly
    hf_queries:
      - electronic health records
      - biobank
    hf_cadence: monthly

  - name: cardio_omics
    label_zh: 心血管队列与临床多组学
    # 2026-09 新增：为 ChinaHEART 心血管队列做准备。大队列心血管风险预测、心血管多组学（蛋白/代谢/脂质/PRS）、
    # MR 找靶点、ECG/影像 AI 与组学/EHR 联合、中国人群队列。周量（CREATION_DATE）：关键词 ~110、整刊 ~30。
    keywords_zh: [心血管, 冠心病, 心力衰竭, 心房颤动, 卒中, 高血压, 动脉粥样硬化, 心血管风险预测, 心电图, 孟德尔随机化, 中国人群队列, 心脏代谢]
    keywords_en: [cardiovascular, coronary artery disease, heart failure, atrial fibrillation, stroke, hypertension, atherosclerosis, cardiometabolic, cardiovascular risk prediction, ECG, electrocardiogram, Mendelian randomization, China Kadoorie Biobank, ChinaHEART, SCORE2, China-PAR, plasma proteomics, lipoprotein, polygenic risk, UK Biobank]
    arxiv:
      categories: [cs.LG, q-bio.QM, eess.SP, stat.AP]
      queries:
        - "cardiovascular risk prediction deep learning"
        - "electrocardiogram foundation model"
        - "heart failure machine learning cohort"
        - "atrial fibrillation deep learning"
    europepmc_query: '(cardiovascular OR "coronary artery disease" OR "heart failure" OR "atrial fibrillation" OR stroke OR hypertension OR atherosclerosis OR cardiometabolic) AND ("deep learning" OR "machine learning" OR "foundation model" OR "risk prediction" OR proteomic OR proteomics OR metabolomic OR polygenic OR "Mendelian randomization" OR "multi-omics") AND (cohort OR biobank OR "population-based" OR "electronic health records")'
    journals:
      - Nature Cardiovascular Research
      - European Heart Journal
      - Circulation
    rss: []
    github_queries:
      - ecg-deep-learning
      - cardiovascular-risk
    github_cadence: weekly
    hf_queries:
      - ecg
    hf_cadence: monthly

  - name: organoid_models
    label_zh: 类器官与模式生物扰动响应
    # 2026-09 新增：类器官 / 器官芯片 / 模式生物上的扰动实验与虚拟响应建模、跨物种迁移。
    # 细胞系层面的虚拟细胞仍归 data_models。
    keywords_zh: [类器官, 器官芯片, 模式生物, 斑马鱼, 线虫, 果蝇, 小鼠模型, 扰动响应, 药物响应, 跨物种, 虚拟组织, 心脏类器官]
    keywords_en: [organoid, organoids, organ-on-a-chip, organ-on-chip, zebrafish, C. elegans, Drosophila, mouse model, perturbation, drug response, CRISPR screen, Perturb-seq, cross-species, virtual tissue, virtual organism, cardiac organoid, single-cell]
    arxiv:
      categories: [q-bio.QM, q-bio.CB, q-bio.TO, cs.LG]
      queries:
        - "organoid deep learning"
        - "organoid perturbation"
        - "cross-species single-cell"
        - "virtual organism"
    europepmc_query: '(organoid OR organoids OR "organ-on-a-chip" OR "organ-on-chip" OR zebrafish OR "C. elegans" OR "Caenorhabditis elegans" OR Drosophila OR "mouse model") AND (perturbation OR "drug response" OR "drug screening" OR "CRISPR screen" OR "Perturb-seq") AND ("single-cell" OR "deep learning" OR "machine learning" OR "foundation model" OR "virtual cell" OR "cross-species" OR predictive)'
    rss: []
    github_queries:
      - organoid
    github_cadence: weekly
    hf_queries: []
    hf_cadence: monthly

  - name: ml_algorithms
    label_zh: ML / AI 底层算法
    keywords_zh: [世界模型, 自监督, 表征学习, 扩散模型, 状态空间模型, JEPA, 掩码自编码器, 线性注意力, 推理时计算]
    keywords_en: [JEPA, world model, self-supervised, representation learning, diffusion, state space model, masked autoencoder, Mamba, linear attention, test-time compute, reasoning LLM]
    arxiv:
      categories: [cs.LG, stat.ML]
      queries:
        - "JEPA"
        - "world model"
        - "self-supervised representation learning"
        - "state space model"
        - "masked autoencoder"
        - "linear attention"
        - "test-time compute"
    europepmc_query: ""
    rss:
      - url: https://jack-clark.net/feed/
        cadence: weekly
      - url: https://research.google/blog/rss/
        cadence: weekly
      - url: https://thegradient.pub/rss/
        cadence: weekly
    github_queries:
      - world-model
      - jepa
      - self-supervised-learning
    github_cadence: weekly
    hf_queries:
      - jepa
      - world model
      - diffusion
    hf_cadence: monthly

  - name: agents
    label_zh: Agent 进展
    keywords_zh: [LLM agent, 工具调用, 强化学习, 自我改进, RSI, RLVR, AI 科学家, 科研智能体, 过程奖励]
    keywords_en: [LLM agent, tool use, reinforcement learning LLM, self-improving, RSI, RLVR, agentic, AI scientist, research agent, scientific discovery, GRPO, process reward model, agentic workflow]
    arxiv:
      categories: [cs.AI, cs.MA]
      queries:
        - "LLM agent"
        - "tool use language model"
        - "reinforcement learning LLM"
        - "self-improving agent"
        - "RLVR"
        - "AI scientist"
        - "GRPO"
        - "process reward model"
    europepmc_query: ""
    rss:
      - https://openai.com/news/rss.xml
      - https://deepmind.google/blog/rss.xml
      - url: "https://www.alignmentforum.org/feed.xml?view=curated-rss"
        cadence: weekly
    # 注：Anthropic / Meta AI 无公开 RSS（2026-09 验证 404），靠 arxiv + 上方 feed 覆盖。
    github_queries:
      - llm-agent
      - agentic
      - rlvr
      - ai-scientist
    github_cadence: weekly
    hf_queries:
      - agent
    hf_cadence: monthly
    # TODO: 后续可接入 Hacker News 高分帖（Algolia API，无 key），此处留注释提醒。

# Semantic Scholar 引用追踪的种子论文：用 DOI:xxx 或 S2 paper id（CorpusId:xxx / 40 位 hash）。
# s2_cadence: daily   # 默认值；想降频就取消注释改成 weekly
seed_papers:
  - DOI:10.18632/aging.101414          # Levine et al. 2018 PhenoAge
  - DOI:10.1038/s41586-023-06139-9     # Geneformer (Nature 2023)
  - DOI:10.1038/s41592-024-02201-0     # scGPT (Nature Methods 2024)
  - DOI:10.1186/gb-2013-14-10-r115     # Horvath 2013 pan-tissue 甲基化时钟
  - DOI:10.1038/s41586-025-09529-3     # Delphi: 生成式 Transformer 学 EHR 预测疾病轨迹 (Nature 2025)
  - DOI:10.1038/s41586-026-10780-5     # ALADYNOULLI: 纵向 EHR + 遗传的贝叶斯生成模型 (Nature 2026)
  - DOI:10.1016/j.cell.2026.08.026     # LongevityBench / aging-biology LLM benchmark (Cell 2026)
  # imAgeScore (cell painting aging) 是 bioRxiv preprint，S2 未收录 DOI，
  # 可在 semanticscholar.org 搜到后改用其 40 位 paper id 加在这里。

# 追踪其新论文的作者。格式 S2 author id（从该作者代表论文的 authors 字段反查最准，
# author/search 返回的多是碎片档案）。
tracked_authors:
  - 144712285   # Steve Horvath（UCLA，甲基化时钟；经 Horvath 2013 论文反查，529 篇）
  - 2958299     # Fabian Theis（Helmholtz/TUM，scGen/scVI 系；经 scGen 论文反查，612 篇）
