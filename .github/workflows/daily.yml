name: daily-radar

on:
  schedule:
    - cron: "23 0 * * *"   # UTC 00:23 = 北京时间 08:23（整点是全网拥堵高峰；实测 GitHub 定时任务仍常晚 4-5 小时）
  workflow_dispatch:
    inputs:
      days:
        description: "回补窗口天数（默认 0 = 按节奏表）"
        type: number
        default: 0

permissions:
  contents: write

concurrency:            # 所有 bot 任务互斥排队，避免同时改 docs/ 与数据文件
  group: radar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: collect + score + digest
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SCORE_MODEL: ${{ vars.SCORE_MODEL }}
          DEEP_MODEL: ${{ vars.DEEP_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          DAYS: ${{ inputs.days || 1 }}
        run: python -m radar.run daily --days "$DAYS"
      - name: commit results (site rebuilt after pull)
        run: scripts/commit_push.sh "digest $(date -u +%F)" digests/ data/
