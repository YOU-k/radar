name: daily-radar

on:
  schedule:
    - cron: "23 0 * * *"   # UTC 00:23 = 北京时间 08:23（整点是全网拥堵高峰，GitHub 定时任务会排长队）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: collect + score + digest
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SCORE_MODEL: ${{ vars.SCORE_MODEL }}
          DEEP_MODEL: ${{ vars.DEEP_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar.run daily
      - name: build site
        run: python -m radar.run site
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/ data/seen.json docs/
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git pull --rebase origin main
          git push
