name: deepdive-report

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "调研主题（中英文均可，如 虚拟细胞 / virtual cell）"
        required: true
      months:
        description: "回溯窗口（月）"
        type: number
        default: 6

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: deepdive
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SCORE_MODEL: ${{ vars.SCORE_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
        run: python -m radar.run deepdive --topic "${{ inputs.topic }}" --months ${{ inputs.months }}
      - name: build site
        run: python -m radar.run site
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          git diff --cached --quiet || git commit -m "deepdive: ${{ inputs.topic }}"
          git pull --rebase --autostash origin main
          git push
