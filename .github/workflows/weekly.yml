name: weekly-radar

on:
  schedule:
    - cron: "41 12 * * 0"   # UTC 周日 12:41 = 北京时间 20:41（实测常晚 4 小时左右）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: renew background reports, resources, joint analysis
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        # 各步内部已隔离失败（单方向出错不中止、生成失败保留旧版）；这里再兜一层，保证周报照常生成
        run: |
          python -m radar.run background renew --topic all || echo "::warning::renew step failed"
          python -m radar.run background resources --topic all || echo "::warning::resources step failed"
          python -m radar.run background joint --topic all || echo "::warning::joint step failed"
      - name: weekly synthesis (after renew, so it can list background changes)
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
        run: python -m radar.run weekly
      - name: commit results (site rebuilt after pull)
        if: always()
        run: scripts/commit_push.sh "weekly $(date -u +%G-W%V)" weekly/ background/ data/
