name: monthly-landscape

on:
  schedule:
    - cron: "17 1 1 * *"   # 每月 1 号 UTC 01:17 = 北京时间 09:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:            # 与 daily 同一天运行时排队，不再并发改 docs/
  group: radar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: registry landscape refresh
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
        run: python -m radar.run landscape
      - name: first-principles judgement across topics
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
          PRINCIPLES_MODEL: ${{ vars.PRINCIPLES_MODEL }}
        run: python -m radar.run background principles --topic all
      - name: commit results (site rebuilt after pull)
        if: always()
        run: scripts/commit_push.sh "landscape $(date -u +%Y-%m)" registry_updates/ background/_principles/
