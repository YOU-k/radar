name: monthly-landscape

on:
  schedule:
    - cron: "30 1 1 * *"   # 每月 1 号 UTC 01:30 = 北京时间 09:30（错开 daily）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: registry landscape refresh
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SYNTH_MODEL: ${{ vars.SYNTH_MODEL }}
        run: python -m radar.run landscape
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry_updates/
          git diff --cached --quiet || git commit -m "landscape $(date -u +%Y-%m)"
          git push
