# 方向定义（人改；其余文件由流水线生成）——虚拟细胞从细胞系走向组织/器官/个体层面
name: 类器官与模式生物虚拟响应建模
definition: >
  在类器官、器官芯片与模式生物（小鼠、斑马鱼、线虫、果蝇）上做扰动实验（药物、遗传、环境），
  以单细胞 / 空间 / 影像 / 表型读出，建模并预测组织、器官与个体层面的响应；含跨物种迁移到人、
  类器官药敏与患者结局对应、以及这类体系的数据资源与评测。
include:
  - 类器官 / 器官芯片上的扰动筛选 + 单细胞 / 空间 / 影像读出，且有预测或建模成分
  - 模式生物扰动响应模型（多器官单细胞图谱、剂量 / 时间响应、表型预测）
  - 跨物种细胞与响应迁移方法（跨物种基础模型、同源映射、小鼠→人预测）
  - 类器官药敏与患者临床响应对应的研究，心脏 / 血管类器官优先
  - 相关大规模数据资源与基准
exclude:
  - 只做类器官构建或培养方案，没有扰动与建模
  - 纯细胞系扰动预测（归虚拟细胞方向）
  - 单一基因敲除的常规表型描述
keywords: [organoid, organoids, organ-on-a-chip, organ-on-chip, zebrafish, C. elegans, Drosophila, mouse,
  perturbation, drug response, drug screening, CRISPR screen, Perturb-seq, single-cell, spatial transcriptomics,
  cross-species, virtual tissue, cardiac organoid, patient-derived organoid, deep learning, foundation model]
queries:
  - "organoid single-cell perturbation screen"
  - "patient-derived organoid drug response prediction"
  - "organ-on-a-chip machine learning drug response"
  - "cross-species single-cell foundation model mouse human"
  - "zebrafish perturbation single-cell atlas"
  - "in vivo Perturb-seq mouse"
  - "cardiac organoid drug screening"
  - "organoid image-based phenotyping deep learning"
journals: [Nature, Cell, Science, Nature Methods, Nature Biotechnology, Cell Stem Cell, Nature Cell Biology, Cell Systems]
seeds:
  - doi:10.1038/s41578-021-00279-y   # Engineering organoids，Nat Rev Mater 2021
  - doi:10.1038/s41576-022-00466-9   # Human organs-on-chips，Nat Rev Genet 2022
  - doi:10.1038/s43586-022-00174-y   # Organoids primer，Nat Rev Methods Primers 2022
  - doi:10.1038/s41592-024-02191-z   # SATURN 跨物种单细胞整合，Nat Methods 2024
  - doi:10.1101/2023.11.28.568918    # UCE 跨物种细胞基础模型
  - doi:10.1038/s41592-023-01969-x   # CellOT 扰动响应最优传输，Nat Methods 2023
radar_domain: [organoid_models, data_models]
months: 36
outline:
  - title: 背景与定义
  - title: 方法学
    children:
      - title: 类器官与器官芯片扰动建模
      - title: 模式生物扰动响应模型
